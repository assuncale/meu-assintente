<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Pessoal</title>
    <style>
        /* Estilos e Cores Limpas */
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent: #475569;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 1. Nível de Energia */
        .energy-section {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .energy-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-energy {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-energy:hover {
            background: var(--border);
        }

        /* 2. Painel Essencial */
        .section-title {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .card-info p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        /* 3. Autocuidado Rápido */
        .checklist {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--bg);
        }

        .check-item:last-child {
            border-bottom: none;
        }

        .check-item input {
            cursor: pointer;
        }

        .check-item label {
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Ritmo do Dia -->
        <div class="energy-section">
            <div class="section-title">Ritmo de Hoje</div>
            <div class="energy-buttons">
                <button class="btn-energy">🟢 Alta</button>
                <button class="btn-energy">🟡 Média</button>
                <button class="btn-energy">🔴 Baixa</button>
            </div>
        </div>

        <!-- Painel de Foco -->
        <div>
            <div class="section-title">Foco Atual</div>
            
            <div class="card">
                <div class="card-info">
                    <h3>📚 Pesquisa</h3>
                    <p>Fichamento de artigo</p>
                </div>
                <button class="btn-action">Iniciar (25m)</button>
            </div>

            <div class="card">
                <div class="card-info">
                    <h3>👩‍🏫 Aulas</h3>
                    <p>Plano da Turma B</p>
                </div>
                <button class="btn-action">Ver Plano</button>
            </div>

            <div class="card">
                <div class="card-info">
                    <h3>💰 Finanças</h3>
                    <p>Saldo da semana</p>
                </div>
                <button class="btn-action">+ Lançar</button>
            </div>
        </div>

        <!-- Autocuidado Rápido -->
        <div>
            <div class="section-title">Autocuidado Rápido</div>
            <div class="checklist">
                <div class="check-item">
                    <input type="checkbox" id="agua">
                    <label for="agua">💧 Água / Voz</label>
                </div>
                <div class="check-item">
                    <input type="checkbox" id="olhos">
                    <label for="olhos">👁️ Pausa para os Olhos (20s)</label>
                </div>
                <div class="check-item">
                    <input type="checkbox" id="maxilar">
                    <label for="maxilar">🧘 Postura / Alongamento Maxilar</label>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
